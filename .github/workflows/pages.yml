# GitHub Pages 배포: main에 push하면 사이트 파일(네 HTML, assets/, data/*.js)만 _site/에 모아 올린다(빌드 없음).
# 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # data/sets/·docs/·tools/·tests/·CLAUDE.md·AGENTS.md 등은 올리지 않는다
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site/data
          cp index.html practice.html db.html library.html _site/
          cp -r assets _site/
          cp data/*.js _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
